    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ue=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:60px 0;text-align:center;color:oklch(0.55 0.01 260);font-size:15px;\">Loading words…<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:60px 0;text-align:center;color:oklch(0.55 0.01 260);font-size:15px;\">No words match \"{{ search }}\" in this tab.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"{{ gridStyle }}\">\n      <sc-for list=\"{{ cards }}\" as=\"card\" hint-placeholder-count=\"6\">\n        <div style=\"perspective:1200px;height:170px;cursor:pointer;\" sc-camel-on-click=\"{{ card.onToggle }}\">\n          <div style=\"{{ card.innerStyle }}\">\n            <div style=\"{{ card.frontStyle }}\">\n              <div style=\"font-size:17px;font-weight:700;line-height:1.3;\">{{ card.word }}<\u002Fdiv>\n              <sc-if value=\"{{ card.showSourceTag }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:12px;left:14px;font-size:10px;font-weight:700;letter-spacing:0.03em;color:{{ accentDark }};background:oklch(0.94 0.025 235);padding:3px 8px;border-radius:999px;\">{{ card.sourceTag }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position:absolute;bottom:14px;left:18px;right:18px;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:oklch(0.6 0.02 260);\">タップして表示<\u002Fdiv>\n              <sc-if value=\"{{ card.isKnown }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:oklch(0.65 0.12 150);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;\">✓<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"{{ card.backStyle }}\">\n              <button sc-camel-on-click=\"{{ card.onToggleKnown }}\" style=\"{{ card.knownBtnStyle }}\">{{ card.knownLabel }}<\u002Fbutton>\n              <div style=\"font-size:14px;line-height:1.45;\">{{ card.definition }}<\u002Fdiv>\n              <sc-if value=\"{{ card.hasJapanese }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:10px;padding-top:10px;border-top:1px solid oklch(0.8 0.03 235 / 0.4);font-size:16px;font-weight:700;color:{{ accentDark }};\">{{ card.japanese }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ card.showExampleLine }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:8px;font-size:12px;font-style:italic;color:oklch(0.45 0.01 260);\">\"{{ card.example }}\"<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer style=\"padding:16px 32px;text-align:center;font-size:12px;color:oklch(0.6 0.01 260);border-top:1px solid oklch(0.92 0.005 260);background:#fff;\">\n    Vocabulary syncs live from the DCLanguage Google Sheet.\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7FAEDD&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#7FAEDD&quot;,&quot;#8FBF9F&quot;,&quot;#D9A05B&quot;,&quot;#B98CC9&quot;]},&quot;cardColumns&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:4,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;cols&quot;},&quot;showExample&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  static TABS = [\n    { id: 'jan', label: 'January 2026' },\n    { id: 'feb', label: 'February 2026' },\n    { id: 'mar', label: 'March 2026' },\n    { id: 'apr', label: 'April 2026' },\n    { id: 'may', label: 'May 2026' },\n    { id: 'jun', label: 'June 2026' },\n    { id: 'expressions', label: 'Expressions' },\n  ];\n\n  static CSV_URLS = {\n    jan: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=0&single=true&output=csv',\n    feb: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=1163664079&single=true&output=csv',\n    mar: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=1078422061&single=true&output=csv',\n    apr: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=1733692776&single=true&output=csv',\n    may: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=1212138132&single=true&output=csv',\n    jun: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=1578650656&single=true&output=csv',\n    expressions: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJwqEWVmUa97lCoHJFJsTdwlenFRkWIOMcF4dEJxV4k0yEq0vjA4p6zHTq_hPspvHDS0A4r1hxfkN0/pub?gid=438621469&single=true&output=csv',\n  };\n\n  static COLS = {\n    vocab: { word: 4, definition: 5, japanese: 6 },\n    expressions: { word: 0, definition: 1 },\n  };\n\n  static SAMPLE_VOCAB = {\n    jan: [\n      { word: 'withdraw', definition: 'To take money out of a bank account.', japanese: '(お金を)引き出す' },\n      { word: 'a rain check', definition: 'An offer to do something later instead of now.', japanese: '延期の申し出' },\n      { word: 'inflation', definition: 'A general rise in prices over time.', japanese: 'インフレ、物価上昇' },\n    ],\n    feb: [\n      { word: 'a ballpark figure', definition: 'A rough estimate, not an exact number.', japanese: 'おおよその数字' },\n      { word: 'recession', definition: 'A period of economic decline.', japanese: '景気後退' },\n    ],\n    mar: [\n      { word: 'a silver lining', definition: 'A positive aspect of a difficult situation.', japanese: '不幸中の幸い' },\n      { word: 'tariff', definition: 'A tax on imported or exported goods.', japanese: '関税' },\n    ],\n    apr: [\n      { word: 'a game changer', definition: 'Something that greatly changes a situation.', japanese: '状況を大きく変えるもの' },\n      { word: 'subsidy', definition: 'Money granted by the government to help an industry.', japanese: '補助金' },\n    ],\n    may: [\n      { word: 'a double-edged sword', definition: 'Something with both good and bad effects.', japanese: '諸刃の剣' },\n      { word: 'deficit', definition: 'The amount by which spending exceeds income.', japanese: '赤字' },\n    ],\n    jun: [\n      { word: 'a rule of thumb', definition: 'A general, practical guideline.', japanese: '経験則' },\n      { word: 'stakeholder', definition: 'A person with an interest in a decision or project.', japanese: '利害関係者' },\n    ],\n  };\n\n  static SAMPLE_EXPRESSIONS = [\n    { word: 'It costs an arm and a leg', definition: 'It is very expensive.' },\n    { word: 'Once in a blue moon', definition: 'Very rarely.' },\n    { word: 'On the same page', definition: 'In agreement; understanding each other.' },\n  ];\n\n  static parseCSV(text) {\n    const rows = [];\n    let row = [], field = '', inQuotes = false;\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i], next = text[i + 1];\n      if (inQuotes) {\n        if (c === '\"' && next === '\"') { field += '\"'; i++; }\n        else if (c === '\"') { inQuotes = false; }\n        else { field += c; }\n      } else if (c === '\"') { inQuotes = true; }\n      else if (c === ',') { row.push(field); field = ''; }\n      else if (c === '\\n' || c === '\\r') {\n        if (c === '\\r' && next === '\\n') i++;\n        row.push(field); field = '';\n        if (row.some(f => f.trim() !== '')) rows.push(row);\n        row = [];\n      } else { field += c; }\n    }\n    if (field !== '' || row.length) { row.push(field); rows.push(row); }\n    return rows;\n  }\n\n  static async fetchTab(url, cols) {\n    const res = await fetch(url);\n    const text = await res.text();\n    const rows = Component.parseCSV(text).slice(1);\n    return rows\n      .filter(r => (r[cols.word] || '').trim())\n      .map((r, i) => ({\n        id: `${r[cols.word]}-${i}`,\n        word: (r[cols.word] || '').trim(),\n        example: '',\n        definition: (r[cols.definition] || '').trim(),\n        japanese: (r[cols.japanese] || '').trim(),\n      }));\n  }\n\n  static async loadTab(tabId) {\n    const isExpressions = tabId === 'expressions';\n    const url = Component.CSV_URLS[tabId];\n    if (url) {\n      try {\n        return await Component.fetchTab(url, isExpressions ? Component.COLS.expressions : Component.COLS.vocab);\n      } catch (e) {\n        console.warn('Falling back to sample data for', tabId, e);\n      }\n    }\n    const sample = isExpressions ? Component.SAMPLE_EXPRESSIONS : (Component.SAMPLE_VOCAB[tabId] || []);\n    return sample.map((s, i) => ({ id: `${s.word}-${i}`, example: '', ...s }));\n  }\n\n  state = {\n    activeTab: 'jan',\n    search: '',\n    flipped: {},\n    data: {},\n    loading: true,\n    known: {},\n  };\n\n  STORAGE_KEY = 'dclanguage_known_words';\n\n  async componentDidMount() {\n    let known = {};\n    try { known = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}'); } catch (e) {}\n    this.setState({ known });\n    try {\n      const entries = await Promise.all(Component.TABS.map(async t => [t.id, await Component.loadTab(t.id)]));\n      const data = Object.fromEntries(entries);\n      this.setState({ data, loading: false });\n    } catch (e) {\n      console.error('Failed to load vocabulary data', e);\n      this.setState({ loading: false });\n    }\n  }\n\n  toggleKnown(key) {\n    this.setState(s => {\n      const known = { ...s.known, [key]: !s.known[key] };\n      try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(known)); } catch (e) {}\n      return { known };\n    });\n  }\n\n  setTab(id) {\n    this.setState({ activeTab: id, search: '' });\n  }\n\n  toggleFlip(id) {\n    this.setState(s => ({ flipped: { ...s.flipped, [id]: !s.flipped[id] } }));\n  }\n\n  renderVals() {\n    const accentColor = this.props.accentColor ?? '#7FAEDD';\n    const accentDark = 'oklch(0.5 0.09 235)';\n    const columns = this.props.cardColumns ?? 3;\n    const showExample = this.props.showExample ?? true;\n\n    const tabs = Component.TABS;\n\n    const activeTab = this.state.activeTab;\n    const search = this.state.search.trim().toLowerCase();\n    const isSearching = !!search;\n    const tabLabelById = Object.fromEntries(tabs.map(t => [t.id, t.label]));\n\n    let rawItems;\n    if (isSearching) {\n      rawItems = [];\n      for (const t of tabs) {\n        for (const it of (this.state.data[t.id] || [])) rawItems.push({ ...it, _tabId: t.id });\n      }\n    } else {\n      rawItems = (this.state.data[activeTab] || []).map(it => ({ ...it, _tabId: activeTab }));\n    }\n\n    const filtered = isSearching\n      ? rawItems.filter(it =>\n          it.word.toLowerCase().includes(search) ||\n          it.definition.toLowerCase().includes(search) ||\n          (it.japanese || '').toLowerCase().includes(search))\n      : rawItems;\n\n    const tabButtons = tabs.map(t => {\n      const active = t.id === activeTab;\n      return {\n        label: t.label,\n        onClick: () => this.setTab(t.id),\n        style: `padding:9px 16px;border-radius:999px;border:1px solid ${active ? accentColor : 'oklch(0.88 0.01 260)'};background:${active ? accentColor : '#fff'};color:${active ? '#fff' : 'oklch(0.3 0.01 260)'};font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;`,\n      };\n    });\n\n    let knownCount = 0;\n    const cards = filtered.map(item => {\n      const isFlipped = !!this.state.flipped[item.id];\n      const knownKey = `${item._tabId}::${item.word.toLowerCase()}`;\n      const isKnown = !!this.state.known[knownKey];\n      if (isKnown) knownCount++;\n      return {\n        word: item.word,\n        definition: item.definition,\n        japanese: item.japanese,\n        example: item.example,\n        hasJapanese: !!item.japanese,\n        showExampleLine: showExample && !!item.example,\n        isKnown,\n        showSourceTag: isSearching,\n        sourceTag: tabLabelById[item._tabId] || '',\n        onToggle: () => this.toggleFlip(item.id),\n        onToggleKnown: e => { e.stopPropagation(); this.toggleKnown(knownKey); },\n        knownLabel: isKnown ? '✓ 覚えた' : 'Mark as known',\n        innerStyle: `position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform:${isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)'};`,\n        frontStyle: `position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1.5px solid ${isKnown ? 'oklch(0.65 0.12 150)' : accentColor};background:#fff;padding:18px;box-sizing:border-box;display:flex;align-items:center;`,\n        backStyle: `position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:14px;background:oklch(0.94 0.025 235);padding:18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:auto;`,\n        knownBtnStyle: `position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;border:1px solid ${isKnown ? 'oklch(0.6 0.12 150)' : 'oklch(0.8 0.01 260)'};background:${isKnown ? 'oklch(0.65 0.12 150)' : '#fff'};color:${isKnown ? '#fff' : 'oklch(0.4 0.01 260)'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;`,\n      };\n    });\n\n    return {\n      accentColor,\n      accentDark,\n      search: this.state.search,\n      onSearchChange: e => this.setState({ search: e.target.value }),\n      tabButtons,\n      activeTabLabel: isSearching ? '全タブ検索結果' : ((tabs.find(t => t.id === activeTab) || {}).label || ''),\n      resultsCountLabel: `${knownCount}/${filtered.length} known`,\n      loading: this.state.loading,\n      showEmpty: !this.state.loading && filtered.length === 0,\n      cards,\n      gridStyle: `display:grid;grid-template-columns:repeat(${columns},1fr);gap:18px;`,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
